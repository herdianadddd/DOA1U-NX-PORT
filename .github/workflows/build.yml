name: Build NRO
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir -p source
          cat > source/main.c << 'C'
          #include <switch.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <time.h>
          int main(){
            consoleInit(NULL);
            PadState pad;
            padConfigureInput(8, HidNpadStyleSet_NpadStandard);
            padInitializeDefault(&pad);
            int p1_x=20, p2_x=60;
            int p1_hp=100, p2_hp=100;
            int p1_anim=0, p2_anim=0;
            bool p1_attack=false, p2_attack=false;
            int timer=0;
            int winner=0;
            const char* fighters[]={"KASUMI","AYANE","RYU","TINA","BASS","LEIFANG"};
            int sel1=0, sel2=1;
            int state=0;
            srand(time(NULL));
            while(appletMainLoop()){
              padUpdate(&pad);
              u64 kDown=padGetButtonsDown(&pad);
              u64 kHeld=padGetButtons(&pad);
              consoleClear();
              if(state==0){
                printf("\x1b[36;1m DOA ULTIMATE TRIBUTE #27 FIX\x1b[0m\n");
                printf("\x1b[31m=========================\x1b[0m\n\n");
                printf(" P1 SELECT: \x1b[33m< %s >\x1b[0m\n", fighters[sel1]);
                printf(" P2 SELECT: \x1b[31m< %s >\x1b[0m\n\n", fighters[sel2]);
                printf(" \x1b[32mA = START FIGHT\x1b[0m\n");
                printf(" \x1b[37mD-Pad LEFT/RIGHT = Change P1\n");
                printf(" \x1b[37mL/R = Change P2, PLUS = Exit\x1b[0m\n");
                if(kDown & HidNpadButton_AnyLeft) sel1=(sel1-1+6)%6;
                if(kDown & HidNpadButton_AnyRight) sel1=(sel1+1)%6;
                if(kDown & HidNpadButton_L) sel2=(sel2-1+6)%6;
                if(kDown & HidNpadButton_R) sel2=(sel2+1)%6;
                if(kDown & HidNpadButton_A) { state=1; p1_hp=100; p2_hp=100; p1_x=20; p2_x=60; }
              }
              else if(state==1){
                if((kHeld & HidNpadButton_AnyLeft) && p1_x>2) p1_x--;
                if((kHeld & HidNpadButton_AnyRight) && p1_x<35) p1_x++;
                if(kDown & HidNpadButton_A) p1_attack=true;
                if(abs(p2_x - p1_x) > 5){
                  if(p2_x > p1_x) p2_x--; else p2_x++;
                } else { if(rand()%20==0) p2_attack=true; }
                int dist = abs(p1_x - p2_x);
                if(p1_attack && dist<8){ p2_hp-=10; p2_anim=10; if(p2_hp<0) p2_hp=0; }
                if(p2_attack && dist<8){ p1_hp-=10; p1_anim=10; if(p1_hp<0) p1_hp=0; }
                if(timer%5==0){ p1_attack=false; p2_attack=false; }
                printf("\x1b[36m %s vs %s \x1b[0m\n", fighters[sel1], fighters[sel2]);
                printf(" P1 HP: \x1b[32m"); for(int i=0;i<p1_hp/5;i++) printf("|"); printf(" %d%%\x1b[0m\n", p1_hp);
                printf(" P2 HP: \x1b[31m"); for(int i=0;i<p2_hp/5;i++) printf("|"); printf(" %d%%\x1b[0m\n\n", p2_hp);
                printf("\n");
                for(int y=0;y<5;y++){ for(int x=0;x<80;x++){ if(y==2){ if(x==p1_x) printf("%s", p1_attack?"\x1b[33m@\x1b[0m":"\x1b[32mO\x1b[0m"); else if(x==p2_x) printf("%s", p2_attack?"\x1b[33m@\x1b[0m":"\x1b[31mX\x1b[0m"); else if(x==p1_x+1 && p1_attack) printf("\x1b[33m-\x1b[0m"); else if(x==p2_x-1 && p2_attack) printf("\x1b[33m-\x1b[0m"); else if(x==40) printf("|"); else printf(" "); } else { if(x==40) printf("|"); else printf(" "); } } printf("\n"); }
                printf("\n\x1b[33m%s %s\x1b[0m   vs   \x1b[31m%s %s\x1b[0m\n", p1_anim?"HIT!":"", p1_attack?"PUNCH!":"", p2_anim?"HIT!":"", p2_attack?"PUNCH!":"");
                printf("\n\x1b[37mLEFT/RIGHT Move, A Punch\x1b[0m\n");
                if(p1_anim>0) p1_anim--; if(p2_anim>0) p2_anim--; timer++;
                if(p1_hp<=0){ winner=2; state=2; } if(p2_hp<=0){ winner=1; state=2; }
              }
              else{
                printf("\n\n\x1b[33;1m  K.O. ! WINNER: %s\x1b[0m\n\n", fighters[winner==1?sel1:sel2]);
                printf("  \x1b[32mA = REMATCH, B = SELECT\x1b[0m\n");
                if(kDown & HidNpadButton_A){ state=1; p1_hp=100; p2_hp=100; }
                if(kDown & HidNpadButton_B) state=0;
              }
              if(kDown & HidNpadButton_Plus) break;
              consoleUpdate(NULL);
            }
            consoleExit(NULL); return 0;
          }
          C
          export PATH=$DEVKITPRO/tools/bin:$DEVKITPRO/devkitA64/bin:$PATH
          aarch64-none-elf-gcc -D__SWITCH__ -march=armv8-a+crc+crypto -mtune=cortex-a57 -mtp=soft -fPIE -g -O2 -I$DEVKITPRO/libnx/include -specs=$DEVKITPRO/libnx/switch.specs source/main.c -L$DEVKITPRO/libnx/lib -lnx -o DOA1U-NX-PORT.elf
          elf2nro DOA1U-NX-PORT.elf DOA1U-NX-PORT.nro --icon=$DEVKITPRO/libnx/default_icon.jpg --name="DOA Tribute #27"
          ls -lh *.nro
      - uses: actions/upload-artifact@v4
        with:
          name: DOA1U-NX-PORT-NRO
          path: "*.nro"
