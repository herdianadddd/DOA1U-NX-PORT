name: Build NRO
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with auto Makefile
        run: |
          rm -rf source build Makefile
          mkdir -p source
          cat > source/main.c << 'C'
          #include <switch.h>
          int main(int argc, char* argv[]){
              consoleInit(NULL);
              printf("DOA1U-NX-PORT #13 GREEN\n");
              while(appletMainLoop()) consoleUpdate(NULL);
              consoleExit(NULL);
              return 0;
          }
          C
          printf 'TARGET := DOA1U-NX-PORT\nBUILD := build\nSOURCES := source\ninclude $(DEVKITPRO)/libnx/switch_rules\n' > Makefile
          cat Makefile
          make -j4
          ls -lh *.nro
      - uses: actions/upload-artifact@v4
        with:
          name: DOA1U-NX-PORT-NRO
          path: "*.nro"
