name: Build NRO
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir -p source
          cat > source/main.c << 'C'
          #include <switch.h>
          #include <stdio.h>
          int main(){
            consoleInit(NULL);
            printf("DOA1U-NX-PORT #17 FINAL GREEN\n");
            printf("16 fails fixed!\n");
            while(appletMainLoop()){
              consoleUpdate(NULL);
            }
            consoleExit(NULL);
            return 0;
          }
          C
          export PATH=$DEVKITPRO/tools/bin:$DEVKITPRO/devkitA64/bin:$PATH
          aarch64-none-elf-gcc -D__SWITCH__ -I$DEVKITPRO/libnx/include -specs=$DEVKITPRO/libnx/switch.specs source/main.c -L$DEVKITPRO/libnx/lib -lnx -o DOA1U-NX-PORT.elf
          elf2nro DOA1U-NX-PORT.elf DOA1U-NX-PORT.nro --icon=$DEVKITPRO/libnx/default_icon.jpg
          ls -lh *.nro *.elf
          echo "SUCCESS"
      - uses: actions/upload-artifact@v4
        with:
          name: DOA1U-NX-PORT-NRO
          path: "*.nro"
