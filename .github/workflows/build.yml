name: Build NRO
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build NRO
        run: |
          export DEVKITPRO=/opt/devkitpro
          export PATH=$DEVKITPRO/tools/bin:$PATH
          make -j$(nproc)
          echo "=== After first make ==="
          ls -lh *.elf || true
          # Build NRO dari ELF
          elf2nro DOA1U-NX-PORT.elf DOA1U-NX-PORT.nro --icon=$DEVKITPRO/libnx/default_icon.jpg || true
          build_pfs0 DOA1U-NX-PORT.nso || true
          echo "=== FINAL FILES ==="
          ls -lh *.nro *.elf *.nso 2>&1
          echo "Build done!"

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: DOA1U-NX-PORT-Switch-FINAL
          path: |
            *.nro
            **/*.nro
            *.elf
          if-no-files-found: warn
